[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanbooks-engine"
version = "0.1.0"
description = "DocTr export, parity fixtures, and benches for scanbooks"
readme = "DESIGN.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "onnx",
  "onnxruntime",
  "torch",
]

[project.optional-dependencies]
doctr = ["timm", "opencv-python-headless"]
dev = ["pytest"]

[project.scripts]
scanbooks-export-doctr = "scanbooks_engine.export_doctr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
