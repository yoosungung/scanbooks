name: Scanbooks
options:
  bundleIdPrefix: net.askwho
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.10"
  BASE_SDK: iphoneos
targets:
  Scanbooks:
    type: application
    platform: iOS
    sources:
      - path: Scanbooks
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.askwho.scanbooks
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Scanbooks
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSCameraUsageDescription: 책 페이지를 스캔하기 위해 카메라가 필요합니다.
      TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - ScanbooksTests
  ScanbooksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScanbooksTests
    dependencies:
      - target: Scanbooks
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: net.askwho.scanbooks.tests
schemes:
  Scanbooks:
    build:
      targets:
        Scanbooks: all
        ScanbooksTests: [test]
    test:
      targets:
        - ScanbooksTests
